version: 1
name: pocketbeagle2-fastboot
goal: Bring up fastboot on the connected PocketBeagle 2 and leave a reproducible solution in the candidate workspace.

parameters:
  # Use the board's debug UART, preferably a stable /dev/serial/by-id path.
  # Do not use the serial port owned by the GPIO reset controller.
  serial: /dev/serial/by-id/usb-Raspberry_Pi_Debug_Probe__CMSIS-DAP__E664A836A32BAC31-if01

candidate: ./automation

sandbox:
  devices:
    - /dev/bus/usb

agent:
  provider: openrouter
  model: google/gemini-3.8-flash
  thinking: low
  zdr: true

capture:
  command: [./capture]

prepare:
  command: [./prepare]
  pass_env: [AIL_GPIOCTL]
  timeout: 30s

exercise:
  timeout: 3m

verify:
  command: [./verify]
  timeout: 30s

attempts: 20
