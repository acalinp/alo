version: 1
name: pocketbeagle2-fastboot
goal: Bring up fastboot on the connected PocketBeagle 2 and leave a reproducible solution in the candidate workspace.

parameters:
  serial: /dev/ttyACM0

candidate: ./automation

sandbox:
  devices:
    - /dev/bus/usb
    - /dev/ttyACM0

agent:
  provider: openrouter
  model: openai/gpt-5.6-sol
  thinking: medium
  zdr: true
  pass_env: [OPENROUTER_API_KEY]
  timeout: 30m

prepare:
  command: [./prepare]
  pass_env: [AIL_GPIOCTL]
  timeout: 30s

exercise:
  timeout: 30m

verify:
  command: [./verify]
  timeout: 30s

attempts: 20
